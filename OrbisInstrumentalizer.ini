; OrbisInstrumentalizer - instrument settings
; Edit over FTP, then close and reopen Rock Band 4 to apply.

; Guitar Hero guitar: accelerometer value that counts as tilted (Overdrive).
; While playing it sits between ~12000 and ~24000, pointing up it reaches 32767.
; Lower = activates with less tilt.
gh_tilt_threshold = 27000

; Rock Band guitar: same, for its tilt sensor.
rb_tilt_threshold = 16384

; Time (ms) the guitar must stay tilted to activate Overdrive.
; Avoids activating it by accident when strumming hard. 0 = instant.
tilt_hold_ms = 50

; Whammy: values below this (0-255) count as released.
; At rest it usually wobbles between 0 and ~38.
whammy_deadzone = 48

; Guitar Hero drums: hits softer than this (1-127) are ignored.
; Raise it if hitting a pad causes ghost notes on its neighbours.
drum_min_velocity = 10

; Logs the raw tilt, whammy and hit velocity values (0 or 1).
calibration_log = 0

; Logs the input latency (0 or 1).
latency_log = 0
