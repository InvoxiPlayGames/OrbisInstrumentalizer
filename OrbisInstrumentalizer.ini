; OrbisInstrumentalizer - ajustes dos instrumentos
; Edite pelo FTP e feche/abra o Rock Band 4 para aplicar.

; Guitarra Guitar Hero: valor do acelerometro que conta como inclinada (Overdrive).
; Tocando fica entre ~12000 e ~24000, apontando para cima chega a 32767.
; Menor = ativa com menos inclinacao.
gh_tilt_threshold = 27000

; Guitarra Rock Band: idem, para o sensor de tilt dela.
rb_tilt_threshold = 16384

; Tempo (ms) que a guitarra precisa ficar inclinada para ativar o Overdrive.
; Evita ativar sem querer ao palhetar forte. 0 = instantaneo.
tilt_hold_ms = 50

; Alavanca (whammy): valores abaixo disso (0-255) contam como solta.
; Parada, a sua oscila entre 0 e ~38.
whammy_deadzone = 48

; Bateria Guitar Hero: batidas mais fracas que isso (1-127) sao ignoradas.
; Aumente se aparecerem notas fantasmas ao bater em pads vizinhos.
drum_min_velocity = 10

; Registra no log os valores brutos de tilt, whammy e forca das batidas (0 ou 1).
calibration_log = 0

; Registra no log a latencia da entrada (0 ou 1).
latency_log = 0
